services:
  plm-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plm-feedback-ai
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    restart: unless-stopped
    volumes:
      - .:/app
      - /app/node_modules
